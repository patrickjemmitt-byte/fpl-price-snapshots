name: FPL price snapshot

on:
  schedule:
    # Evening window in UTC. Covers 00:00 UK time in both GMT and BST.
    - cron: "*/15 19-23 * * *"
    # Early morning run to record what actually changed.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices
        run: python3 fetch_prices.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.md prices.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update FPL price snapshot"
            git push
          fi
